name: Build Windows (Tauri)

# 윈도우용 데스크톱 설치본(msi/exe) 빌드.
# - 수동 실행(Actions 탭 → Run workflow) 또는 v* 태그 푸시 시 자동 빌드
# - 데스크톱 앱은 사내 서버 절대주소가 필요 → 저장소 시크릿 SERVER_IP(예: 10.0.0.5)를 주입
#   (포트가 8000이 아니면 아래 VITE_API_BASE 를 수정)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend-react/src-tauri -> target

      - name: Install frontend deps
        working-directory: frontend-react
        run: npm ci

      - name: Build Tauri (Windows)
        working-directory: frontend-react
        env:
          # 사내 서버 절대주소(빌드 타임 주입). 시크릿에 IP만 넣고 여기서 URL 조립.
          VITE_API_BASE: http://${{ secrets.SERVER_IP }}:8000
        run: npm run tauri:build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            frontend-react/src-tauri/target/release/bundle/msi/*.msi
            frontend-react/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
